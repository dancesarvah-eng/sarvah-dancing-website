[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/hero"
  to = "/.netlify/functions/hero"
  status = 200

[[redirects]]
  from = "/api/hero/upload"
  to = "/.netlify/functions/hero-upload"
  status = 200

[[redirects]]
  from = "/api/hero/delete"
  to = "/.netlify/functions/hero-delete"
  status = 200

[[redirects]]
  from = "/api/gallery"
  to = "/.netlify/functions/gallery"
  status = 200

[[redirects]]
  from = "/api/gallery/upload"
  to = "/.netlify/functions/gallery-upload"
  status = 200

[[redirects]]
  from = "/api/gallery/delete"
  to = "/.netlify/functions/gallery-delete"
  status = 200

[[redirects]]
  from = "/api/admin/verify"
  to = "/.netlify/functions/admin-verify"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200