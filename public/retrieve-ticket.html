
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrieve Your Ticket — Sarvah Dance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Josefin+Sans:wght@200;300;400;600&family=Crimson+Pro:ital,wght@0,300;0,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F0E3; --parchment:#E8D9BB; --rust:#B84A1A; --burgundy:#6B1A0A;
  --gold:#C09448; --gold-light:#D4B060; --text:#2C1A0E; --text-light:#6B5040; --white:#FFFDF8; --red:#C0392B;
}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{max-width:480px;width:100%;background:var(--white);border:1px solid var(--parchment);overflow:hidden}
.gopuram-border{height:12px;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,var(--gold-light) 10px 20px)}
.body-pad{padding:2.8rem 2.4rem}
h1{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:500;color:var(--burgundy);margin-bottom:0.5rem;text-align:center}
p.sub{color:var(--text-light);font-size:0.92rem;line-height:1.6;text-align:center;margin-bottom:1.8rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-family:'Josefin Sans',sans-serif;font-size:0.62rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-light);margin-bottom:0.4rem}
.form-group input{width:100%;padding:0.9rem 1rem;border:1px solid var(--parchment);background:var(--cream);font-family:'Crimson Pro',serif;font-size:1rem;outline:none}
.form-group input:focus{border-color:var(--gold)}
.btn{width:100%;padding:0.95rem;background:var(--rust);color:var(--white);border:none;font-family:'Josefin Sans',sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:background 0.25s}
.btn:hover{background:var(--burgundy)}
.btn:disabled{opacity:0.6;cursor:default}
.error-box{color:var(--red);font-size:0.85rem;text-align:center;margin-top:1rem;display:none}

.ticket-block{border:1px solid var(--parchment);background:var(--white);padding:1.4rem;margin-top:1.5rem;text-align:left}
.ticket-block .tnum{font-family:'Josefin Sans',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--rust);margin-bottom:0.4rem}
.ticket-block .event{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--burgundy);margin-bottom:0.6rem}
.ticket-block img{display:block;margin:1rem auto;width:170px;height:170px;border:1px solid var(--parchment)}
.ticket-id{font-family:monospace;font-size:0.9rem;text-align:center;letter-spacing:0.05em;color:var(--burgundy);font-weight:600}

.btn-download{display:block;width:100%;margin-top:1.5rem;padding:0.9rem;background:var(--burgundy);color:var(--white);border:none;font-family:'Josefin Sans',sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer}
.btn-download:disabled{opacity:0.6;cursor:default}
a.home-link{display:block;text-align:center;margin-top:1.5rem;color:var(--text-light);font-size:0.82rem;text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="gopuram-border"></div>
  <div class="body-pad">
    <h1>Retrieve Your Ticket</h1>
    <p class="sub">Enter the email and phone number you used when booking, and we'll pull up your ticket(s).</p>

    <form id="retrieveForm" onsubmit="doRetrieve(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="rEmail" required placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="rPhone" required placeholder="+1 000 000 0000">
      </div>
      <button type="submit" class="btn" id="rSubmitBtn">Find My Ticket</button>
      <div class="error-box" id="rError"></div>
    </form>

    <div id="resultsArea"></div>

    <a class="home-link" href="/">Return Home</a>
  </div>
</div>

<script>
let lastEmail = '', lastPhone = '';

async function doRetrieve(e) {
  e.preventDefault();
  const email = document.getElementById('rEmail').value.trim();
  const phone = document.getElementById('rPhone').value.trim();
  const btn = document.getElementById('rSubmitBtn');
  const errBox = document.getElementById('rError');
  const results = document.getElementById('resultsArea');

  errBox.style.display = 'none';
  results.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Searching…';

  try {
    const res = await fetch('https://sarvah-dance-website.onrender.com/api/tickets/retrieve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, phone })
    });
    const data = await res.json();

    if (!data.success) {
      errBox.textContent = '❌ ' + (data.message || 'No tickets found.');
      errBox.style.display = 'block';
      return;
    }

    lastEmail = email;
    lastPhone = phone;

    results.innerHTML = data.tickets.map(t => `
      <div class="ticket-block">
        ${t.ticketCount > 1 ? `<div class="tnum">Ticket ${t.ticketNumber} of ${t.ticketCount}</div>` : ''}
        <div class="event">${escHtml(t.eventTitle || 'Event')}</div>
        <div style="font-size:0.85rem;color:var(--text-light)">${escHtml(t.eventDate || '')} ${t.eventTime ? '· ' + escHtml(t.eventTime) : ''}</div>
        <img src="${t.qrDataUrl}" alt="QR code">
        <div class="ticket-id">${escHtml(t.ticketId)}</div>
      </div>
    `).join('') + `<button class="btn-download" onclick="downloadAll()">⬇ Download All as PDF</button>`;

  } catch (err) {
    errBox.textContent = '❌ Network error — please try again.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find My Ticket';
  }
}

async function downloadAll() {
  try {
    const res = await fetch('https://sarvah-dance-website.onrender.com/api/tickets/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: lastEmail, phone: lastPhone })
    });
    if (!res.ok) throw new Error('Could not generate PDF');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sarvah-tickets.pdf';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Could not download PDF: ' + e.message);
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
